[project]
name = "patchpilot"
version = "0.1.0"
description = "Autonomous open-source contribution agent"
requires-python = ">=3.13,<4.0"
dependencies = [
    "pydantic (>=2.9,<3.0)",
    "pydantic-settings (>=2.6,<3.0)",
    "structlog (>=24.4,<26.0)",
    "httpx (>=0.28,<0.29)",
    "tenacity (>=9.0,<10.0)",
    "langgraph (>=0.6,<0.7)",
    "langgraph-checkpoint-sqlite (>=2.0,<3.0)",
    "google-genai (>=1.0,<2.0)",
    "langsmith (>=0.3,<0.4)",
    "qdrant-client[fastembed] (>=1.12,<2.0)",
    "rank-bm25 (>=0.2,<0.3)",
    "docker (>=7.1,<8.0)",
    "typer (>=0.15,<0.16)",
    "rich (>=13.9,<14.0)",
    "mcp (>=1.2,<2.0)",
]

[project.scripts]
patchpilot = "patchpilot.cli.main:main"
patchpilot-mcp = "patchpilot.mcp.server:main"

[tool.poetry]
packages = [{ include = "patchpilot", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
respx = "^0.22"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: touches the network, Docker, or other real services (deselect with '-m \"not integration\"')",
]
addopts = "-q --strict-markers"
filterwarnings = [
    # Upstream LangGraph deprecation we do not control and cannot act on.
    "ignore:The default value of `allowed_objects`:DeprecationWarning",
    "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]  # line length is handled by the formatter, not the linter

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; nesting `pytest.raises` inside a resource
# context is clearer than merging them, which is what SIM117 asks for.
"tests/**" = ["S101", "SIM117"]
# Nested `with` blocks read better than a merged one when the inner context is
# a resource whose scope is deliberately narrower than the outer.
"src/patchpilot/cli/*.py" = ["SIM117"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# rank_bm25 ships no py.typed marker. Declared here rather than silenced at the
# import site, so the untyped surface is visible in one place.
[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

# The docker SDK ships no type stubs. Declared here rather than silenced at the
# import site, so the untyped surface is visible in one place.
[[tool.mypy.overrides]]
module = "docker.*"
ignore_missing_imports = true
